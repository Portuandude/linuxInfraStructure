# App 업스트림 - 다중 인스턴스 로드밸런싱
#
# ⚠️ 현재는 App(infra/app)이 구현되기 전이라, docker-compose.yml에서
#    app1/app2/app3를 임시 목업(traefik/whoami)으로 띄워 LB 동작을 검증합니다.
#    App 구현 완료 후 동일한 서비스명(app1/app2/app3)만 실제 App으로 교체하면
#    이 설정은 그대로 재사용됩니다.
upstream app_backend {
    least_conn;

    server app1:3000 max_fails=3 fail_timeout=10s;
    server app2:3000 max_fails=3 fail_timeout=10s;
    server app3:3000 max_fails=3 fail_timeout=10s;

    keepalive 32;
}

server {
    listen 80;
    server_name _;

    limit_req zone=req_limit_per_ip burst=40 nodelay;

    # LB 자체 헬스체크 (외부 모니터링/로드밸런서 앞단 확인용)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # Prometheus nginx-exporter가 스크랩할 상태 엔드포인트 (내부 네트워크만 허용)
    # nginx-exporter는 monitoring 서브넷(172.20.2.0/24)에 위치하므로 /16 전체를 허용
    location = /nginx_status {
        stub_status;
        allow 172.20.0.0/16;
        allow 127.0.0.1;
        deny all;
    }

    location / {
        proxy_pass http://app_backend;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 3s;
        proxy_read_timeout    10s;

        # 하나의 App 인스턴스가 실패하면 자동으로 다음 upstream으로 재시도 (장애 대응)
        proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }
}
