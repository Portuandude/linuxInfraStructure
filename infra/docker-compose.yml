# 계획된 서비스:
#   nginx       - 로드밸런서 (infra/nginx) [구현 완료]
#   app1/2/3    - 사내 서비스 애플리케이션 (infra/app) [미구현 - traefik/whoami로 임시 대체]
#   db          - PostgreSQL (infra/db) [구현 완료]
#   prometheus  - 메트릭 수집 (infra/monitoring/prometheus) [예정]
#   grafana     - 대시보드 (infra/monitoring/grafana) [예정]
#   node-exporter - 호스트 메트릭 [예정]
#   cadvisor    - 컨테이너 메트릭 [예정]
#
# 네트워크 계획은 docs/network-design.md 참고.

networks:
  frontend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
  backend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.1.0/24
  monitoring:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.2.0/24

services:
  nginx:
    build: ./nginx
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    depends_on:
      - app1
      - app2
      - app3
    networks:
      - frontend
    restart: unless-stopped

  # ⚠️ 임시 목업 (infra/app 구현 전 LB 동작 검증용)
  #    구현 완료 후 image/command만 실제 App으로 교체 — infra/nginx/README.md 참고
  app1:
    image: traefik/whoami
    command: ["-port", "3000", "-name", "app1"]
    networks:
      - frontend

  app2:
    image: traefik/whoami
    command: ["-port", "3000", "-name", "app2"]
    networks:
      - frontend

  app3:
    image: traefik/whoami
    command: ["-port", "3000", "-name", "app3"]
    networks:
      - frontend

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-app_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - POSTGRES_DB=${POSTGRES_DB:-company_service}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app_user} -d ${POSTGRES_DB:-company_service}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # 설계상 호스트 포트는 노출하지 않음 (backend 네트워크 내부 전용, docs/network-design.md 참고)

  # prometheus:
  #   ...
  # grafana:
  #   ...

volumes:
  db_data:
