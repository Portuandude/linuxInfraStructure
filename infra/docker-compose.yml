# 계획된 서비스:
#   nginx       - 로드밸런서 (infra/nginx) [구현 완료]
#   app1/2/3    - 사내 서비스 애플리케이션 (infra/app) [구현 완료]
#   db          - PostgreSQL (infra/db) [예정]
#   prometheus  - 메트릭 수집 (infra/monitoring/prometheus) [예정]
#   grafana     - 대시보드 (infra/monitoring/grafana) [예정]
#   node-exporter - 호스트 메트릭 [예정]
#   cadvisor    - 컨테이너 메트릭 [예정]
#
# 네트워크 계획은 docs/network-design.md 참고.

networks:
  frontend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
  backend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.1.0/24
  monitoring:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.2.0/24

services:
  nginx:
    build: ./nginx
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    depends_on:
      - app1
      - app2
      - app3
    networks:
      - frontend
    restart: unless-stopped

  # 사내 서비스 App - 동일 이미지를 3개 인스턴스로 기동해 Nginx가 로드밸런싱
  app1:
    build: ./app
    environment:
      - INSTANCE_NAME=app1
    networks:
      - frontend
      - backend
    restart: unless-stopped

  app2:
    build: ./app
    environment:
      - INSTANCE_NAME=app2
    networks:
      - frontend
      - backend
    restart: unless-stopped

  app3:
    build: ./app
    environment:
      - INSTANCE_NAME=app3
    networks:
      - frontend
      - backend
    restart: unless-stopped

  # db:
  #   ...
  # prometheus:
  #   ...
  # grafana:
  #   ...
