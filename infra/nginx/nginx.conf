user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 모니터링/로그 분석 연계를 위한 JSON 액세스 로그
    log_format json_combined escape=json
      '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_response_time":"$upstream_response_time",'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent"'
      '}';

    access_log  /var/log/nginx/access.log  json_combined;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   256;
    gzip_types        text/plain text/css application/json application/javascript
                      text/xml application/xml text/javascript;

    # 과도한 요청으로부터 App을 보호하기 위한 기본 rate limit
    #
    # ⚠️ 300 VU 부하 테스트(2026-09-13)에서 rate=20r/s burst=40으로는 82% 요청이
    #    503으로 차단됨을 발견. 사내 서비스는 다수 사용자가 같은 사내망 게이트웨이(NAT)를
    #    통해 접속해 동일 IP로 보일 수 있어, IP 기준 rate limit을 낮게 잡으면 정상
    #    사용자 트래픽까지 막힌다. docs/incident-reports/2026-09-13-ratelimit-503.md 참고.
    limit_req_zone $binary_remote_addr zone=req_limit_per_ip:10m rate=1000r/s;

    include /etc/nginx/conf.d/*.conf;
}
